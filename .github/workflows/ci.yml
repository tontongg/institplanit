name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: institplanit
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: institplanit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U institplanit -d institplanit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://institplanit:test-password@localhost:5432/institplanit_test?schema=public
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://institplanit:test-password@localhost:5432/institplanit_test?schema=public